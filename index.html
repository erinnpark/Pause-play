<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topics</title>
  <link rel="stylesheet" href="homepage.css" />
</head>
<body>
  <div class="dream-bg">
    <span class="sunbeam sunbeam-one"></span>
    <span class="sunbeam sunbeam-two"></span>

    <span class="cloud cloud-one"></span>
    <span class="cloud cloud-two"></span>
    <span class="cloud cloud-three"></span>

    <span class="orb orb-one"></span>
    <span class="orb orb-two"></span>
    <span class="orb orb-three"></span>
  </div>

  <div id="sparkleContainer"></div>

  <div class="intro-overlay" id="intro-overlay">
    <button class="intro-popup" id="intro-popup" type="button">
      Step into a word-scramble listening experience.
    </button>
  </div>

  <div class="home-stage topics">
    <main class="player">
      <p class="label">Now Playing</p>
      <h1>WORD SCRAMBLE!!</h1>

      <p class="instruction">
        Pick a level!!
      </p>

      <section class="word-bank">
        <a href="randomness/index.html" class="link"><span class="item">EASY</span></a>
        <a href="time/index.html" class="link"><span class="item">MEDIUM</span></a>
        <a href="interaction/index.html" class="link"><span class="item">HARD</span></a>
        <a href="loop/index.html" class="link"><span class="item">EXTRA HARD</span></a>
      </section>
    </main>

    <aside class="guide-panel" aria-label="Homepage instructions">
      <p class="label">How to Play</p>

      <ol class="guide-list">
        <li>
          <span class="guide-number">1</span>
          <span>Choose a difficulty level: Easy &middot; Medium &middot; Hard &middot; Extra Hard.</span>
        </li>
        <li>
          <span class="guide-number">2</span>
          <span>If a word is incorrect, the sentence will not continue.</span>
        </li>
        <li>
          <span class="guide-number">3</span>
          <span>When the full sentence is correct, a sound will play!</span>
        </li>
      </ol>

      <div class="listening-badge">
        <span>click</span>
        <span>listen</span>
        <span>play</span>
      </div>
    </aside>
  </div>

  <script src="homepage.js"></script>
</body>
</html>
